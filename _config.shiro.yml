# Site
site:
  favicon: https://image.fatcattech.cn/i/2026/05/16/1255mw3.png
  since: 2024
  seal: true
  seal_text: "白"
  rss:
    enabled: true
    path: /atom.xml

# Navigation menu
menu:
  - name: 首页
    url: /
  - name: 归档
    url: /archives
  - name: 分类
    url: /categories/
  - name: 标签
    url: /tags/
  - name: 随机
    url: /random

# Excerpt settings
excerpt:
  fallback:
    enabled: true
    length: 200

# Table of Contents (TOC)
toc:
  enabled: true
  depth: 3
  min_headings: 3

# MathJax TeX rendering (all post/page views; opt out with mathjax: false)
mathjax:
  enabled: true
  every_page: true

# Dark mode
dark_mode:
  default: system
  toggle: true

# Reading progress bar
progress_bar:
  enabled: true

# Word count & reading time
word_count:
  enabled: true

# Back to top button
back_to_top:
  enabled: true

# Comment systems
comments:
  enabled: true
  provider: giscus
  disqus:
    shortname: ""
  giscus:
    src: https://giscus.app/client.js
    repo: 69gg/69gg.github.io
    repo_id: R_kgDOSfCvAQ
    category: Q&A
    category_id: DIC_kwDOSfCvAc4C9LFy
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: bottom
    lang: zh-CN
    theme: css/giscus-folio.css
    lazy_loading: true

# Analytics
analytics:
  google:
    enabled: false
    id: ""

# Search
search:
  enabled: true

# Maximum first-scene preparation time; failures must not block reading.
folio:
  preload_timeout: 6000
