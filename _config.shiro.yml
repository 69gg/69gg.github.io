# Site
site:
  favicon: /favicon.svg
  seal: true
  seal_text: "白"
  rss:
    enabled: true
    path: /atom.xml

# Navigation menu
menu:
  - name: 首页
    url: /
  - name: 归档
    url: /archives
  - name: 留言
    url: /guestbook
  - name: 随机
    url: /random

# Excerpt settings
excerpt:
  fallback:
    enabled: true
    length: 200

# Table of Contents (TOC)
toc:
  enabled: true
  depth: 3
  min_headings: 3

# Dark mode
dark_mode:
  default: system
  toggle: true

# Reading progress bar
progress_bar:
  enabled: true

# Back to top button
back_to_top:
  enabled: true

# Comment systems
comments:
  enabled: true
  provider: giscus
  disqus:
    shortname: ""
  giscus:
    src: https://giscus.app/client.js
    repo: 69gg/69gg.github.io
    repo_id: R_kgDOSfCvAQ
    category: Q&A
    category_id: DIC_kwDOSfCvAc4C9LFy
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: bottom
    lang: zh-CN
    theme: https://cdn.jsdelivr.net/npm/hexo-theme-shiro@1.3.2/source/css/giscus.css
    lazy_loading: true

# Analytics
analytics:
  google:
    enabled: false
    id: ""

# Search
search:
  enabled: true
